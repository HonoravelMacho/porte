name: release

# Gera binários da release: .apk (Android) + .deb (Linux).
# Apple ignorado por ora (sem macos jobs).
# Auth: usa o GITHUB_TOKEN automático (sem secret manual).
# Para assinar o APK, cadastre opcionalmente os secrets:
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.9"
  APP_DIR: app

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze --no-fatal-infos || true

      - name: Keystore (opcional, só se secrets existirem)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: ${{ env.ANDROID_KEYSTORE_B64 != '' }}
        working-directory: ${{ env.APP_DIR }}/android/app
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > release.keystore
          cat >> key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build APK (release)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release

      - name: Renomear APK
        run: cp ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk porte-${{ github.ref_name }}-android.apk

      # Caminho principal (tags v*): publica direto na Release.
      # Evita upload-artifact (cota de artifacts estourada não bloqueia release).
      - name: Publicar APK na release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: porte-${{ github.ref_name }}-android.apk
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fallback p/ workflow_dispatch (sem tag): tenta artifact (pode falhar
      # se a cota de artifacts seguir estourada).
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: porte-android-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk

  linux-deb:
    # Ubuntu 22.04 de propósito: binário linkado contra glib 2.72 roda em
    # 22.04+ (Pop!_OS 22.04, Mint 21...). Build no 24.04 quebra nesses
    # sistemas (undefined symbol: g_once_init_enter_pointer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Deps Linux + dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Pub get
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Build Linux bundle
        working-directory: ${{ env.APP_DIR }}
        run: flutter build linux --release

      - name: Montar .deb
        run: |
          chmod +x packaging/deb/build-deb.sh
          ./packaging/deb/build-deb.sh "${{ github.ref_name }}"

      - name: Publicar DEB na release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.deb
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: porte-linux-deb
          path: dist/*.deb
