name: porte
description: "PORTE — gerenciador de arquivos Sci-Fi/Skeuomorphic em Flutter com terminal integrado e cofre criptografado. Open-source, multiplataforma (Android/Linux)."
publish_to: 'none'
version: 0.0.8+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  permission_handler: ^12.0.0
  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.0
  open_filex: ^4.7.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  path: ^1.9.1
  intl: ^0.20.2
  mime: ^2.0.0
  archive: ^4.0.7
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
